name: AI Code Review with MiniMax

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# contents: read is for the job only. No step checks out or runs code from the pull request: the coverage gate and the
# action read the diff through the GitHub API. Never switch this workflow to pull_request_target.
permissions:
  contents: read
  pull-requests: write

# One review per pull request. A new push cancels the review of the head it replaces, so only the final head is reviewed
# and no API call repeats for the same head.
concurrency:
  # A label event that starts no review gets its own group, so it cannot cancel a review in progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'needs-minimax-review') && github.run_id || 'review' }}
  cancel-in-progress: true

# Campaign policy (owner, 2026-11-02): MiniMax reviews every eligible pull request automatically. Before this campaign
# (issue #180) it ran only on the label needs-minimax-review; that label still starts a review, for example to review a
# draft. Eligible means: the head branch is in this repository (a fork gets no secret), and the pull request is not a
# draft unless it carries the label (then every push is reviewed). Other label events start nothing. CodeRabbit stays as an additional reviewer.
jobs:
  review:
    name: Review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      && (
        (github.event.action == 'labeled' && github.event.label.name == 'needs-minimax-review')
        || (github.event.action != 'labeled' && (github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'needs-minimax-review')))
      )
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MAX_DIFF_CHARS: "250000"
      # Not reviewed: lock files, and the baselines that a recorder wrote (oracle/<name>-baseline/*.json, and the recordings
      # nested by case, oracle/<name>-baseline/**/*.json: a "*" does not cross a "/" in either matcher, so the nested files need
      # their own pattern; GitHub gives no patch for the large ones, and a person cannot read them). The gate lists every such file in the job summary, and the stamp
      # on the review comment names them, so the omission is visible to a reader. Also not reviewed: ledger/snapshots/<name>/
      # ledger.json, a byte copy of the previous ledger that each ledger step stores (7000+ lines, no GitHub patch). The step's
      # tool refuses to run unless the copy matches the sha256 it names, and verify_ledger.py replays the chain, so the
      # change itself (ledger/ledger.json, the tool, verify_ledger.py) stays in the review.
      # Also not reviewed (owner decision 2026-11-02): vendor/web-audio-api/src and resources, byte-identical to the upstream
      # crate web-audio-api 1.7.0. "Fast checks" runs tools/check_vendored_web_audio_api.py, which downloads the crate, checks
      # its sha256 and fails on any difference, so an unexpected change there fails the build instead of passing unseen. Our own
      # changes stay in the review: vendor/web-audio-api/Cargo.toml, VENDOR.md, LICENSE and README.md, and every tool and test.
      # Also not reviewed (owner decision 2026-11-03, PR #363): the files of vendor/rav1d/src (except decode.rs), vendor/rav1d/include and the upstream prose files (NEWS.dav1d, CONTRIBUTING.md, THANKS.md, README.md, gcovr.cfg),
      # byte-identical to the upstream crate rav1d 1.1.0. tools/check_vendored_rav1d.py (run by "Fast checks" in rust-tests.yml)
      # downloads the crate, checks its sha256 and fails on any difference, so a changed file there fails the build instead of
      # passing unseen. The one modified file, src/decode.rs, stays in the review, and so do vendor/rav1d/Cargo.toml and its other
      # manifests, build.rs, lib.rs, COPYING, VENDOR.md, every tool and test. Do not widen this to the whole directory.
      # Also not reviewed (owner decision 2026-11-04, issue #89): the files of vendor/wgpu-hal that are byte-identical to the upstream crate
      # wgpu-hal 30.0.1 (every file of src except src/vulkan/descriptor.rs, plus examples, README.md and .cargo_vcs_info.json).
      # tools/check_vendored_wgpu_hal.py (run by "Fast checks" in rust-tests.yml) checks the crate's sha256 and fails on any
      # difference or any unexpected file there. The modified src/vulkan/descriptor.rs, x3d-descriptor-pool.patch, VENDOR.md,
      # vendor/wgpu-hal/Cargo.toml, Cargo.toml.orig, build.rs and the licenses, the checker and the root Cargo.toml stay in the
      # review. Do not widen this to the whole directory.
      EXCLUDE_PATTERNS: "*.lock,package-lock.json,yarn.lock,pnpm-lock.yaml,oracle/*-baseline/*.json,oracle/*-baseline/**/*.json,ledger/snapshots/*/ledger.json,vendor/web-audio-api/src/**,vendor/web-audio-api/resources/**,vendor/rav1d/src/align.rs,vendor/rav1d/src/arm/**,vendor/rav1d/src/assume.rs,vendor/rav1d/src/c_arc.rs,vendor/rav1d/src/c_box.rs,vendor/rav1d/src/cdef.rs,vendor/rav1d/src/cdef_apply.rs,vendor/rav1d/src/cdf.rs,vendor/rav1d/src/const_fn.rs,vendor/rav1d/src/cpu.rs,vendor/rav1d/src/ctx.rs,vendor/rav1d/src/cursor.rs,vendor/rav1d/src/data.rs,vendor/rav1d/src/dequant_tables.rs,vendor/rav1d/src/disjoint_mut.rs,vendor/rav1d/src/enum_map.rs,vendor/rav1d/src/env.rs,vendor/rav1d/src/error.rs,vendor/rav1d/src/ext/**,vendor/rav1d/src/extensions.rs,vendor/rav1d/src/ffi_safe.rs,vendor/rav1d/src/fg_apply.rs,vendor/rav1d/src/filmgrain.rs,vendor/rav1d/src/getbits.rs,vendor/rav1d/src/in_range.rs,vendor/rav1d/src/internal.rs,vendor/rav1d/src/intra_edge.rs,vendor/rav1d/src/ipred.rs,vendor/rav1d/src/ipred_prepare.rs,vendor/rav1d/src/iter.rs,vendor/rav1d/src/itx.rs,vendor/rav1d/src/itx_1d.rs,vendor/rav1d/src/levels.rs,vendor/rav1d/src/lf_apply.rs,vendor/rav1d/src/lf_mask.rs,vendor/rav1d/src/lib.rs,vendor/rav1d/src/log.rs,vendor/rav1d/src/loopfilter.rs,vendor/rav1d/src/looprestoration.rs,vendor/rav1d/src/lr_apply.rs,vendor/rav1d/src/mc.rs,vendor/rav1d/src/mem.rs,vendor/rav1d/src/msac.rs,vendor/rav1d/src/obu.rs,vendor/rav1d/src/pal.rs,vendor/rav1d/src/pic_or_buf.rs,vendor/rav1d/src/picture.rs,vendor/rav1d/src/pixels.rs,vendor/rav1d/src/qm.rs,vendor/rav1d/src/recon.rs,vendor/rav1d/src/refmvs.rs,vendor/rav1d/src/relaxed_atomic.rs,vendor/rav1d/src/scan.rs,vendor/rav1d/src/send_sync_non_null.rs,vendor/rav1d/src/strided.rs,vendor/rav1d/src/tables.rs,vendor/rav1d/src/thread_task.rs,vendor/rav1d/src/warpmv.rs,vendor/rav1d/src/wedge.rs,vendor/rav1d/src/with_offset.rs,vendor/rav1d/src/wrap_fn_ptr.rs,vendor/rav1d/src/x86/**,vendor/rav1d/include/**,vendor/rav1d/NEWS.dav1d,vendor/rav1d/CONTRIBUTING.md,vendor/rav1d/THANKS.md,vendor/rav1d/README.md,vendor/rav1d/gcovr.cfg,vendor/wgpu-hal/.cargo_vcs_info.json,vendor/wgpu-hal/README.md,vendor/wgpu-hal/examples/**,vendor/wgpu-hal/src/auxil/**,vendor/wgpu-hal/src/dx12/**,vendor/wgpu-hal/src/dynamic/**,vendor/wgpu-hal/src/gles/**,vendor/wgpu-hal/src/metal/**,vendor/wgpu-hal/src/noop/**,vendor/wgpu-hal/src/lib.rs,vendor/wgpu-hal/src/validation_canary.rs,vendor/wgpu-hal/src/vulkan/adapter.rs,vendor/wgpu-hal/src/vulkan/command.rs,vendor/wgpu-hal/src/vulkan/conv.rs,vendor/wgpu-hal/src/vulkan/device.rs,vendor/wgpu-hal/src/vulkan/drm.rs,vendor/wgpu-hal/src/vulkan/instance.rs,vendor/wgpu-hal/src/vulkan/mod.rs,vendor/wgpu-hal/src/vulkan/sampler.rs,vendor/wgpu-hal/src/vulkan/semaphore_list.rs,vendor/wgpu-hal/src/vulkan/swapchain/**"
    steps:
      # Fails the job when the action would not send the whole diff to the model, instead of a review that looks complete.
      # The action sends only files that have a patch, in order, and drops a file that does not fit under MAX_DIFF_CHARS.
      # GitHub gives no patch for a binary file or for a text file whose diff is too large.
      - name: Diff coverage gate
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('REVIEW_START', new Date(Date.now() - 2000).toISOString());
            const limit = Number(process.env.MAX_DIFF_CHARS);
            const patterns = process.env.EXCLUDE_PATTERNS.split(',').map(p => p.trim()).filter(Boolean);
            const toRegExp = p => new RegExp('^' + p.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*\*/g, '\u0000').replace(/\*/g, '[^/]*').replace(/\u0000/g, '.*') + '$');
            const matches = name => patterns.some(p => toRegExp(p).test(name) || toRegExp(p).test(name.split('/').pop()));
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number, per_page: 100,
            });
            const excluded = files.filter(f => matches(f.filename)).map(f => f.filename);
            const kept = files.filter(f => !matches(f.filename));
            // A patch that holds fewer changed lines than additions + deletions is cut short.
            const patchLines = f => f.patch.split('\n').filter(l => /^[+-]/.test(l)).length;
            const truncated = kept.filter(f => f.patch && patchLines(f) !== f.additions + f.deletions).map(f => f.filename);
            const capped = files.length >= 3000; // the API lists at most 3000 files
            const noPatchText = kept.filter(f => !f.patch && (f.additions + f.deletions) > 0).map(f => f.filename);
            const noPatchBinary = kept.filter(f => !f.patch && (f.additions + f.deletions) === 0).map(f => f.filename);
            let total = 0;
            const over = [];
            for (const f of kept.filter(f => f.patch)) {
              const entry = `### ${f.filename} (${f.status})\n\`\`\`diff\n${f.patch}\n\`\`\``;
              if (total + entry.length > limit) over.push(f.filename); else total += entry.length;
            }
            const list = a => a.length ? a.map(n => `  - ${n}`).join('\n') : '  (none)';
            const lines = [
              `Review identity: head ${process.env.HEAD_SHA}, run ${context.runId}, model ${process.env.MINIMAX_MODEL_NAME}`,
              `Files in the pull request: ${files.length}. Diff characters sent: ${total} of ${limit}.`,
              `Excluded by pattern (not reviewed):\n${list(excluded)}`,
              `No patch, binary or empty change (not reviewed):\n${list(noPatchBinary)}`,
              `No patch, text change too large for GitHub (NOT reviewed):\n${list(noPatchText)}`,
              `Patch shorter than its change count (NOT fully reviewed):\n${list(truncated)}`,
              `Over the character limit (NOT reviewed):\n${list(over)}`,
            ];
            if (capped) lines.push('The file list reached the API limit of 3000 files (NOT fully reviewed).');
            await core.summary.addRaw('```\n' + lines.join('\n') + '\n```', true).write();
            core.info(lines.join('\n'));
            core.exportVariable('NOT_REVIEWED', [...excluded, ...noPatchBinary].join('\n'));
            // With no file left to send (for example a pull request of recorded baselines only) the action posts no comment,
            // so the review and its stamp are skipped and the summary says why.
            const reviewable = kept.filter(f => f.patch).length;
            core.exportVariable('REVIEWABLE', String(reviewable));
            if (reviewable === 0) await core.summary.addRaw('\nNo changed file is left for review after the exclusions: no review was needed.\n', true).write();
            const missing = [...noPatchText, ...truncated, ...over];
            if (capped) missing.push('(file list capped at 3000)');
            if (missing.length > 0) {
              core.setFailed(`The review would not cover ${missing.length} changed file(s): ${missing.join(', ')}. Split the pull request, or review those files by hand. No review was requested.`);
            }
        env:
          MINIMAX_MODEL_NAME: ${{ vars.MINIMAX_MODEL }}

      - name: Code Review
        if: env.REVIEWABLE != '0'
        # Fork of tarmojussila/minimax-code-review adding reasoning-effort and timeout inputs.
        uses: Ascendance3D/minimax-code-review@v0.5.0
        with:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_MODEL: ${{ vars.MINIMAX_MODEL }}
          MINIMAX_SYSTEM_PROMPT: ${{ vars.MINIMAX_SYSTEM_PROMPT }}
          MINIMAX_REVIEWER_NAME: ${{ vars.MINIMAX_REVIEWER_NAME }}
          MINIMAX_REASONING_EFFORT: ${{ vars.MINIMAX_REASONING_EFFORT || 'medium' }}
          REQUEST_TIMEOUT_SECONDS: ${{ vars.REQUEST_TIMEOUT_SECONDS || '600' }}
          EXCLUDE_PATTERNS: ${{ env.EXCLUDE_PATTERNS }}
          MAX_DIFF_CHARS: ${{ env.MAX_DIFF_CHARS }}

      # The action keeps one comment per pull request and updates it in place, and the comment names no commit. This step
      # stamps the comment with the head that the run reviewed, so a reader can match a review to an exact head.
      - name: Stamp the review with its head
        if: env.REVIEWABLE != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- minimax-code-review -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number, per_page: 100,
            });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (!mine) { core.setFailed('The action posted no review comment.'); return; }
            // A comment older than this run is a review of an earlier head (the action skips an empty diff). Do not stamp it.
            if (Date.parse(mine.updated_at) < Date.parse(process.env.REVIEW_START)) {
              core.setFailed('The review comment was not updated by this run, so it does not review head ' + process.env.HEAD_SHA + '.');
              return;
            }
            const skipped = (process.env.NOT_REVIEWED || '').split('\n').filter(Boolean);
            const shown = skipped.slice(0, 30).map(n => `\`${n}\``).join(', ') + (skipped.length > 30 ? ` and ${skipped.length - 30} more` : '');
            const note = skipped.length ? ` Not reviewed (lock files, recorded baselines, binary files): ${shown}.` : '';
            const stamp = `\n\n_Reviewed head: \`${process.env.HEAD_SHA}\`, run ${context.runId}, model ${process.env.MODEL}.${note}_`;
            const body = mine.body.replace(/\n\n_Reviewed head: [^\n]*_/, '');
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id,
              body: body.replace(marker, stamp.trimStart() + '\n\n' + marker),
            });
        env:
          MODEL: ${{ vars.MINIMAX_MODEL }}
