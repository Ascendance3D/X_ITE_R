name: AI Code Review with MiniMax

on:
  pull_request:
    types: [labeled]

permissions:
  pull-requests: write

# Each review reads the whole PR diff (pulls.listFiles), so a new push cancels the review of the commit it replaces:
# the next review covers that commit's changes too. Each PR has its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# On demand only (issue #180): CodeRabbit is the normal review. MiniMax reviews a PR when someone adds the label
# needs-minimax-review, for example when CodeRabbit is rate-limited or skips the PR, or for a second review. To review
# again after a push, remove the label and add it again. The Rust and Web test workflows do not run on "labeled".
jobs:
  review:
    name: Review
    if: github.event.label.name == 'needs-minimax-review'
    runs-on: ubuntu-latest
    steps:
      - name: Code Review
        # Fork of tarmojussila/minimax-code-review adding reasoning-effort and timeout inputs.
        uses: Ascendance3D/minimax-code-review@v0.5.0
        with:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_MODEL: ${{ vars.MINIMAX_MODEL }}
          MINIMAX_SYSTEM_PROMPT: ${{ vars.MINIMAX_SYSTEM_PROMPT }}
          MINIMAX_REVIEWER_NAME: ${{ vars.MINIMAX_REVIEWER_NAME }}
          MINIMAX_REASONING_EFFORT: ${{ vars.MINIMAX_REASONING_EFFORT || 'medium' }}
          REQUEST_TIMEOUT_SECONDS: ${{ vars.REQUEST_TIMEOUT_SECONDS || '600' }}
          MAX_DIFF_CHARS: "250000"
