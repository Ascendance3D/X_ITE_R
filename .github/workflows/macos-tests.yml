# Build and test on macOS 15 (issue #87), on a GitHub-hosted arm64 runner: the workspace builds, and the non-GPU tests
# run. This is not a Metal or physical-Mac result. The hosted runner is a virtual machine; the "Graphics adapter" step
# prints what it offers, and a result from it is labeled virtualized.
#
# The same tests are skipped by name as in rust-tests.yml (GPU_TESTS; keep the list equal, tools/check_gpu_test_lists.py
# checks it), plus the tests that this job lists in the job summary when they skip for a missing adapter
# (X3D_EVIDENCE_ALLOW). Not a required check: "Rust tests result" and "Web tests result" stay the required checks.
name: macOS tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".config/**"
      - "rust-toolchain*"
      - ".github/workflows/macos-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  X3D_EVIDENCE: ci
  X3D_EVIDENCE_ALLOW: no-gpu-adapter,backend-absent,x_ite-text.json,items-baseline.json,x0-baseline.json,x0-xml-baseline.json
  X3D_EVIDENCE_LOG: ${{ github.workspace }}/evidence-skips.tsv
  X3D_QUIET_NO_GPU: "1"
  GPU_TESTS: >-
    test(x1_runtime_matches_x_ite)
    | test(items_runtime_matches_x_ite)
    | test(rea_batch09_nav_shard0_match_x_ite)
    | test(rea_batch09_nav_shard1_match_x_ite)
    | test(rea_batch09_nav_shard2_match_x_ite)
    | test(rea_batch09_nav_shard3_match_x_ite)
    | test(rea_batch09_inputs_cases_match_x_ite)
    | test(rea_batch08_net_cases_match_x_ite)
    | test(rea_batch12_pick_cases_match_x_ite)
    | test(rea_b14_particle_pick_matches_x_ite)
    | test(rea_b15_particle_collision_matches_x_ite)
    | test(rea_b21_wide_lines_match_x_ite)
    | test(rea_b22_two_layer_shadows_match_x_ite)
    | test(rea_b24_nav_shard0_match_x_ite)
    | test(rea_b24_nav_shard1_match_x_ite)
    | test(rea_b24_nav_shard2_match_x_ite)

  # Tests that fail on the hosted macOS 15 arm64 virtual machine for a reason that is not a build defect (run 41557728237
  # of PR #342). The job summary lists them by name; issue #88 (audio) and issue #89 (graphics) track them.
  #  - late_connected_oscillator_keeps_its_phase, same_rate_mp3_and_flac_are_bit_identical, vrml_audio_matches_x_ite:
  #    exact or tolerance-0 comparisons that arm64 misses by about 1e-7 (the last digits of a float) against the x86-64
  #    baselines. The tolerance is NOT widened: the difference is the finding.
  #  The three graphics tests of that run (splat_picks_match_pinned_x_ite, splat_picks_under_logarithmic_depth_match_pinned_x_ite,
  #  renderer_probes_and_device_starts_share_the_lock) run again (issue #89, docs/gpu-failure-classification.md): the
  #  headless device now asks for Metal on macOS (it asked for Vulkan only), and the splat pick tests carry a macOS
  #  tolerance fixed before the run. The virtual machine's paravirtual graphics device is not a physical GPU.
  #  - Eleven rendering comparisons that the headless Metal fix made visible (run 41575177567 of PR #351; before the fix
  #    their device start found no Vulkan adapter and they skipped as "no adapter"). They differ from the pinned images
  #    by far more than a rounding (up to 9% of the pixels over 8, max channel difference 255; the logarithmic-depth tests
  #    get the wrong depth order). Cause not determined: virtualized device or a Metal-specific defect of the renderer;
  #    docs/gpu-failure-classification.md lists them. Skipped here so that the optional check stays readable, and still
  #    open under issue #89.
  MACOS_HOSTED_SKIPS: >-
    test(late_connected_oscillator_keeps_its_phase)
    | test(same_rate_mp3_and_flac_are_bit_identical)
    | test(vrml_audio_matches_x_ite)
    | test(rea_batch07_vol_cases_match_x_ite)
    | test(rea_i92_render_items_match_x_ite)
    | test(standard_and_log_match_x_ite)
    | test(splats_in_logarithmic_depth_match_x_ite)
    | test(rea_b24_anchor_collision_instanced_match_x_ite)
    | test(log_shows_what_standard_cannot)
    | test(rea_b07_vol_renders_match_x_ite)
    | test(rea_b08_gs_renders_match_x_ite)
    | test(rea_b08_vs_renders_match_x_ite)
    | test(rea_batch01_cases_match_x_ite)
    | test(rea_b09_inputs_renders_match_x_ite)

jobs:
  macos:
    name: macOS 15 build and tests
    # A draft pull request starts no job. ready_for_review starts a new run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-test
          cache-on-failure: true

      - name: Machine
        run: |
          {
            echo "### macOS runner"
            sw_vers
            uname -m
            test "$(uname -m)" = "arm64"
            echo "CPUs: $(sysctl -n hw.ncpu), memory: $(( $(sysctl -n hw.memsize) / 1048576 )) MiB"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Information only: what graphics device the virtual machine offers. It does not decide any result.
      - name: Graphics adapter (information)
        continue-on-error: true
        run: |
          { echo "### Graphics (virtualized runner; not a physical Mac)"; system_profiler SPDisplaysDataType 2>&1 | head -30; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the workspace
        run: cargo build --workspace --release --all-targets 2>&1 | tee build.log; test "${PIPESTATUS[0]}" -eq 0

      - name: Rust suite (GPU tests skipped)
        run: |
          rm -f "$X3D_EVIDENCE_LOG"
          cargo nextest run --workspace --release --profile ci --no-fail-fast -E "not ($GPU_TESTS) and not ($MACOS_HOSTED_SKIPS)" 2>&1 | tee suite.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Doctests
        if: success() || failure()
        run: |
          cargo test --workspace --release --doc --no-fail-fast 2>&1 | tee doctests.log
          test "${PIPESTATUS[0]}" -eq 0

      # The skips by name: the GPU tests excluded above, and every evidence skip with its reason.
      - name: Skips by name
        if: always()
        run: |
          {
            echo "### Skipped by name (GPU_TESTS, issue #66 rule)"
            echo "$GPU_TESTS" | tr '|' '\n' | sed 's/^ *//; s/ *$//' | sed '/^$/d'
            echo "### Skipped on the hosted virtual machine only (MACOS_HOSTED_SKIPS)"
            echo "$MACOS_HOSTED_SKIPS" | tr '|' '\n' | sed 's/^ *//; s/ *$//' | sed '/^$/d'
            grep -E '^ *Summary \[' suite.log 2>/dev/null | sed 's/^ *//' || echo "no nextest Summary line"
            grep -E '^ +(FAIL|SIGSEGV|SIGABRT|SIGKILL|TIMEOUT|LEAK-FAIL) ' suite.log 2>/dev/null | sort -u || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -I -B tools/evidence_summary.py "$X3D_EVIDENCE_LOG" | tee -a "$GITHUB_STEP_SUMMARY"
          test "${PIPESTATUS[0]}" -eq 0
