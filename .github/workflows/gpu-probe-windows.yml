# One-off, read-only probe of the Windows self-hosted runner (issue #89). It prints the graphics adapters and nothing else.
# NOT FOR MERGE: this file lives only on a draft pull request branch, which is closed after the result is read.
# No checkout, no secrets, no write permission, no cache, no artifact. The job runs only when the pull request head is in
# this repository, so a pull request from a fork cannot reach the runner through this file.
name: GPU probe (Windows)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/gpu-probe-windows.yml"

permissions: {}

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    # The runner's execution policy blocks script files, so each step is cmd with inline PowerShell commands (no policy change).
    steps:
      - name: OS and machine
        shell: cmd
        run: |
          powershell -NoProfile -Command "Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List; Get-CimInstance Win32_ComputerSystem | Select-Object Manufacturer, Model, NumberOfLogicalProcessors, TotalPhysicalMemory, HypervisorPresent | Format-List"
          powershell -NoProfile -Command "'session id ' + [System.Diagnostics.Process]::GetCurrentProcess().SessionId; 'user ' + [System.Security.Principal.WindowsIdentity]::GetCurrent().Name"
      - name: Graphics adapters
        shell: cmd
        run: |
          powershell -NoProfile -Command "Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, DriverDate, AdapterRAM, VideoProcessor, PNPDeviceID, Status, ConfigManagerErrorCode | Format-List"
          powershell -NoProfile -Command "Get-PnpDevice -Class Display -ErrorAction SilentlyContinue | Select-Object Status, FriendlyName, InstanceId | Format-List"
          where nvidia-smi
          exit /b 0
      - name: Vulkan, DX12 and tools
        if: always()
        shell: cmd
        run: |
          if exist "%windir%\System32\vulkan-1.dll" (echo vulkan-1.dll in System32: yes) else (echo vulkan-1.dll in System32: no)
          if exist "%windir%\System32\d3d12.dll" (echo d3d12.dll in System32: yes) else (echo d3d12.dll in System32: no)
          reg query HKLM\SOFTWARE\Khronos\Vulkan\Drivers
          reg query HKLM\SOFTWARE\WOW6432Node\Khronos\Vulkan\Drivers
          where cargo rustup node python git vulkaninfo dxdiag
          exit /b 0
      - name: DirectX diagnostic, display section
        if: always()
        shell: cmd
        run: |
          powershell -NoProfile -Command "$out = Join-Path $env:RUNNER_TEMP 'dxdiag.txt'; Start-Process -FilePath dxdiag.exe -ArgumentList '/whql:off','/t',$out -Wait -NoNewWindow; $d = (Get-Date).AddSeconds(90); while (-not (Test-Path $out) -and (Get-Date) -lt $d) { Start-Sleep -Seconds 2 }; if (Test-Path $out) { $t = Get-Content $out; $s = ($t | Select-String -Pattern '^Display Devices' | Select-Object -First 1).LineNumber; if ($s) { $t[($s - 1)..([Math]::Min($s + 40, $t.Count - 1))] } else { 'no Display Devices section' }; Remove-Item $out -Force } else { 'dxdiag wrote no file' }"
