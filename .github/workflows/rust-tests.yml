# Rust tests for pull requests, on a standard GitHub-hosted Linux runner (no GPU).
#
# The runner has no GPU, so the eight GPU tests are skipped here by name, and so is
# rea_batch12_pick_cases_match_x_ite: its pk-* cases compare the GPU pointing buffer (pickProbes and
# TouchSensor order), which differs without a GPU (first CI run, 2026-10-21). The other rea_batch12
# cases (vw-*, bbb-*) are in rea_batch12_view_billboard_cases_match_x_ite and run here. For the same reason
# rea_b14_particle_pick_matches_x_ite (ParticleSystem pickProbes against the GPU pointing buffer) is skipped, and
# rea_b15_particle_collision_matches_x_ite (ParticleSystem avatar collision against the GPU depth buffer), which
# would otherwise return early without an adapter and report a pass, and rea_b21_wide_lines_match_x_ite (wide LINE
# particles in the pointing, collision and shadow passes; its CPU collision half runs here), and
# rea_b22_two_layer_shadows_match_x_ite (wide LINE particle shadows in two layers, a GPU shadow pass). The thirteen
# skipped tests all stay in the local process, run on the RTX machine:
#
#   __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json \
#   systemd-run --user --scope -p MemoryMax=8G -p MemorySwapMax=0 \
#     cargo test --workspace --release -j 16 --no-fail-fast
#
# It runs strict (X3D_EVIDENCE unset), so a missing key or adapter fails. The Mesa EGL vendor lets
# gl_backend_cannot_run_the_renderer_and_says_so start a GL device; the NVIDIA one does not (backend-absent).
#
# The "Fast checks" job runs first, on every PR: the reference pins, the answer-key guard, rustfmt, actionlint and
# tools/ci_changes.py, which decides from the changed paths whether the suite is needed. A docs-only, metadata-only,
# Fast-checks-tool-only or browser-only PR leaves the suite out, and so does a draft PR (docs/agents/ci.md). The "Rust tests result" job always reports: it fails when a needed job did not pass.
#
# A push to master runs "Fast checks" and "Warm cache" only. A PR can read its own caches and master's, not another
# PR's; "Warm cache" builds the suite once for each new Cargo.lock on master, so the first run of every PR finds
# its dependencies built.
#
# Missing evidence never passes in silence (issue #66, crates/x3d-evidence). X3D_EVIDENCE=ci lets a test skip
# only for a reason or answer key in X3D_EVIDENCE_ALLOW; any other skip, and every answer-key mismatch, fails
# the test. Each permitted skip is one line in X3D_EVIDENCE_LOG; the "Evidence skips" step lists them and the
# by-name skips below in the job summary, and fails on a line outside the allow list.
# The audio tests need no GPU and no audio device: they render with an OfflineAudioContext.

name: Rust tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request: a new push cancels the run of the commit it replaces. Each PR has its own group, and a
# workflow_dispatch run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  X3D_EVIDENCE: ci
  # no-gpu-adapter and backend-absent: the runner has no GPU and no GL device. The two keys are gitignored
  # (oracle/answer-keys.tsv) and are not on the runner: x_ite-text.json (x3d-text oracle) and
  # items-baseline.json (vrml97 items_parse_only). The private Cybertown archive outputs of issue #168 are not
  # on the runner either: x0-baseline.json (x3d-parse, vrml97 and x3d-script x0 oracles) and x0-xml-baseline.json
  # (x3d-scene and x3d-script XML/JSON x0 oracles).
  X3D_EVIDENCE_ALLOW: no-gpu-adapter,backend-absent,x_ite-text.json,items-baseline.json,x0-baseline.json,x0-xml-baseline.json
  X3D_EVIDENCE_LOG: ${{ github.workspace }}/evidence-skips.tsv
  CARGO_INCREMENTAL: "0"
  # The suite links about 170 release test binaries. lld links them in a fraction of the time and memory of the
  # default ld.bfd, which is what had limited the build to two jobs; the runner has four cores.
  CARGO_BUILD_JOBS: "4"
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
  # x3d-drive and x3d-particles-drive print a "no pointing GPU" notice per run; the GPU-less runner runs them
  # hundreds of times.
  X3D_QUIET_NO_GPU: "1"
  GPU_TESTS: >-
    --skip x1_runtime_matches_x_ite
    --skip items_runtime_matches_x_ite
    --skip rea_batch09_nav_shard0_match_x_ite
    --skip rea_batch09_nav_shard1_match_x_ite
    --skip rea_batch09_nav_shard2_match_x_ite
    --skip rea_batch09_nav_shard3_match_x_ite
    --skip rea_batch09_inputs_cases_match_x_ite
    --skip rea_batch08_net_cases_match_x_ite
    --skip rea_batch12_pick_cases_match_x_ite
    --skip rea_b14_particle_pick_matches_x_ite
    --skip rea_b15_particle_collision_matches_x_ite
    --skip rea_b21_wide_lines_match_x_ite
    --skip rea_b22_two_layer_shadows_match_x_ite

jobs:
  checks:
    name: Fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      # Depth 2: the PR merge commit and its first parent, for the changed paths.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Changed paths
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          # A draft PR runs neither suite (tools/ci_changes.py); ready_for_review starts a new run.
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          python3 -I -B tools/ci_changes.py --self-test
          if [ "$EVENT" = pull_request ]; then
            python3 -I -B tools/ci_changes.py
          else
            python3 -I -B tools/ci_changes.py --all
          fi

      # The 16.6.0 reference pin is inert: nothing in the build reads it, so nothing in the
      # build notices a changed byte. This is that notice, and it needs no toolchain, so it
      # runs before the build. --self-test proves the checker still refuses a tampered pin.
      - name: X_ITE 16.6.0 reference pin
        run: |
          python3 -I -B tools/verify-reference-pin.py
          python3 -I -B tools/verify-reference-pin.py --self-test

      # The answer-key resolver checks and guard (issue #65), on synthetic Git repositories in a temporary
      # directory. The Rust half is the x3d-evidence unit tests in the test step.
      - name: Answer-key resolver and guard
        run: python3 -I -B tools/test_answer_keys.py

      # The standards fixture manifests (oracle/standards/): the checker's synthetic tests, then the real manifests.
      # It runs on every pull request (about 2 s), so a change to a fixture that a manifest lists also fails here.
      - name: Standards fixture manifests
        run: python3 -I -B oracle/tools/test_standards_manifest.py

      # The ACTIVE reference: X_ITE 16.5.0 (oracle/x_ite-pin), checked by version and content digest
      # against tools/candidate.lock.
      # This is the reference half of the gate only; no commit identity is checked or approved.
      # The self-test runs in a disposable sparse clone and proves each refusal names its reason.
      - name: Active reference pin (X_ITE 16.5.0)
        run: |
          tools/verify-candidate.sh
          tools/selftest-identity.sh

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      # Workflow validation: actionlint, pinned by version and digest.
      - name: Workflows (actionlint)
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -no-color

  test:
    needs: checks
    if: github.event_name != 'push' && needs.checks.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev clang lld

      # The shared key gives "Warm cache" the same cache; it is also the name the job-based key had.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-on-failure: true

      - name: Rust suite (GPU tests skipped)
        run: |
          rm -f "$X3D_EVIDENCE_LOG"
          # GPU_TESTS is a list of arguments: it is split on purpose.
          # shellcheck disable=SC2086
          cargo test --workspace --release --no-fail-fast -- $GPU_TESTS 2>&1 | tee suite.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Test counts
        if: always()
        run: |
          grep '^test result' suite.log | awk '{p+=$4; f+=$6; i+=$8; s+=$12} END {printf "passed %d, failed %d, ignored %d, filtered out %d\n", p, f, i, s}' | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E '^test .* FAILED$' suite.log | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Evidence skips
        if: success() || failure()
        run: |
          python3 -I -B tools/evidence_summary.py "$X3D_EVIDENCE_LOG" | tee -a "$GITHUB_STEP_SUMMARY"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Audio oracle (rea_b05, X_ITE 16.5.0 baselines)
        if: success() || failure()
        run: |
          cargo build --release -p x3d-viewer --bin x3d-drive
          python3 -I -B oracle/tools/rea_b05.py check --target target/release --jobs 2 | tee rea_b05.log
          test "${PIPESTATUS[0]}" -eq 0
          tail -1 rea_b05.log >> "$GITHUB_STEP_SUMMARY"

      # Clippy's deny-by-default lints only — `correctness` and the parts of `suspicious` that
      # fire here. It is run *without* `-D warnings`: the workspace still carries 887
      # warn-level findings across 63 lint kinds (169 collapsible_if, 94 excessive_precision,
      # 70 needless_range_loop, 56 neg_cmp_op_on_partial_ord, ...), and a list of 63 `-A` flags
      # would be the broad suppression this gate exists to avoid. What this does hold is the
      # class that made `cargo clippy` unusable: until this change, x3d-fields failed to
      # compile under clippy, which stopped every crate behind it from being checked at all.
      # Clearing the whole warn-level backlog is its own lane.
      #
      # `--release` so the dependency graph is the one the suite above already built, instead of
      # a second debug graph. Runs after the suite, and on its failure, so a clippy regression
      # does not hide the test results.
      - name: Clippy (deny-by-default lints)
        if: success() || failure()
        run: cargo clippy --release --workspace --all-targets

      # The account's artifact storage can be full; the logs are then only in the job log.
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: test-logs
          path: |
            suite.log
            rea_b05.log
            evidence-skips.tsv
          if-no-files-found: ignore

  # On a push to master: the dependencies of the suite, built into master's cache with the key of the "test" job.
  # When master already has that cache, the job ends after the lookup.
  warm-cache:
    name: Warm cache
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: test
          lookup-only: true

      - name: System libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev clang lld

      - name: Build the suite (no run)
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo test --workspace --release --no-run

  # The one check that always reports: success only when "Fast checks" passed and the suite passed or was not needed.
  # A cancelled or failed job fails it, so it never passes for a run that did not finish.
  result:
    name: Rust tests result
    needs: [checks, test]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Needed jobs passed
        env:
          CHECKS: ${{ needs.checks.result }}
          NEEDED: ${{ needs.checks.outputs.rust }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "Fast checks: $CHECKS; suite needed: ${NEEDED:-unknown}; suite: $TEST" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$CHECKS" = success
          if [ "$NEEDED" = true ]; then test "$TEST" = success; else test "$NEEDED" = false && test "$TEST" = skipped; fi
