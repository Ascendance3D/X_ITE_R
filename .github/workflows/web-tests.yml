# Browser tests of X_ITE_R's <x3d-canvas> (crates/x3d-web), in headless Chromium with WebGPU.
#
# The runner has no GPU: Chromium's WebGPU runs on SwiftShader, Chromium's own CPU Vulkan driver (the adapter the
# test summary reports: vendor google, architecture swiftshader), not on Mesa's lavapipe. The browser module is
# built for wasm32-unknown-unknown with tools/build-web.sh. The API case and the runtime 02 cases are compared with the
# pinned X_ITE 16.5.0 recordings in oracle/web-browser-01-baseline and oracle/web-browser-02-baseline. The native
# tests of the crate run in rust-tests.yml.
# Locally: tools/build-web.sh && (cd crates/x3d-web && npm ci && npm test); see crates/x3d-web/README.md.
#
# One job builds the module; the test files then run in parallel shards, one runner each, as
# crates/x3d-web/tests/browser/shards.mjs lists them. That list must name every test file once, or the "Changed
# paths" job fails. tools/ci_changes.py leaves the build and the shards out when no changed path reaches the browser
# module or its tests, and for a draft PR (docs/agents/ci.md). Five shards, not one job: issue #180 measured a
# single job at 2.1 to 2.4 times the wall-clock time for a saving of about 11% in runner minutes. The "Web tests result" job always reports: it fails when a needed job did not pass.
#
# A push to master runs "Browser module" and "Warm browser dependencies" only, to fill master's caches (the module's
# Rust build once for each new Cargo.lock, and apt's .deb files): a PR can read its own caches and master's, not
# another PR's.

name: Web tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request: a new push cancels the run of the commit it replaces. Each PR has its own group, and a
# workflow_dispatch run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      web: ${{ steps.changes.outputs.web }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      # Depth 2: the PR merge commit and its first parent, for the changed paths.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Changed paths
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          # A draft PR runs neither suite (tools/ci_changes.py); ready_for_review starts a new run.
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          python3 -I -B tools/ci_changes.py --self-test
          if [ "$EVENT" = pull_request ]; then
            python3 -I -B tools/ci_changes.py
          else
            python3 -I -B tools/ci_changes.py --all
          fi

      - name: Test shards
        id: shards
        run: echo "shards=$(node crates/x3d-web/tests/browser/shards.mjs matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: Browser module
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      # The shared key is the name the cache had when the job was "browser". On a push to master the job only looks the
      # cache up, and builds when master does not have it yet.
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: web-browser
          cache-on-failure: true
          lookup-only: ${{ github.event_name == 'push' }}

      # wasm-bindgen's CLI must be the exact version of the wasm-bindgen crate in Cargo.lock.
      - name: wasm-bindgen CLI
        if: github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true'
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen $version" || cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the browser module
        if: github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true'
        run: tools/build-web.sh

      # The shards of this run take the module from here. The key holds the run ID, so no other run reads it, and a
      # re-run of a shard alone finds it.
      - uses: actions/cache/save@v6
        if: github.event_name != 'push'
        with:
          path: crates/x3d-web/web/pkg
          key: web-pkg-${{ github.run_id }}

  browser:
    name: browser (${{ matrix.shard }})
    needs: [changes, build]
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/cache/restore@v6
        with:
          path: crates/x3d-web/web/pkg
          key: web-pkg-${{ github.run_id }}
          fail-on-cache-miss: true

      - uses: ./.github/actions/browser-deps

      - name: Browser tests
        working-directory: crates/x3d-web
        env:
          SHARD: ${{ matrix.shard }}
          XR_WEB_EVIDENCE: ${{ github.workspace }}/web-evidence
        run: |
          mapfile -t files < <(node tests/browser/shards.mjs files "$SHARD")
          node --test --test-concurrency=1 "${files[@]}" 2>&1 | tee ../../web-tests.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Test counts
        if: always()
        run: grep -E '^ℹ (tests|pass|fail|skipped)|WebGPU adapter' web-tests.log | awk '!seen[$0]++' | tee -a "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: web-test-evidence-${{ matrix.shard }}
          path: |
            web-tests.log
            web-evidence/
          if-no-files-found: ignore

  # On a push to master: the browser test dependencies, so that master's cache holds apt's .deb files for every PR.
  warm-deps:
    name: Warm browser dependencies
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/browser-deps

  # The one check that always reports: success only when "Changed paths" passed, and the build and every shard
  # passed or were not needed. A cancelled or failed job fails it, so it never passes for a run that did not finish.
  result:
    name: Web tests result
    needs: [changes, build, browser]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Needed jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          NEEDED: ${{ needs.changes.outputs.web }}
          BUILD: ${{ needs.build.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "Changed paths: $CHANGES; browser suite needed: ${NEEDED:-unknown}; build: $BUILD; shards: $BROWSER" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$CHANGES" = success
          if [ "$NEEDED" = true ]; then
            test "$BUILD" = success && test "$BROWSER" = success
          else
            test "$NEEDED" = false && test "$BUILD" = skipped && test "$BROWSER" = skipped
          fi
