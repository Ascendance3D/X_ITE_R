name: Browser test dependencies
description: >-
  Node 24, the npm packages of crates/x3d-web, Playwright's Chromium and Mesa's Vulkan drivers (lavapipe), for the
  browser tests in web-tests.yml.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: crates/x3d-web/package-lock.json

    # The .deb files of Mesa and of Chromium's libraries, kept between runs: on 3 of 8 runners of PR #117 the Ubuntu
    # mirror sent 45 kB/s and this install took 15 to 17 minutes. apt checks each file against the package index and
    # fetches it again when it differs.
    # Not on a self-hosted runner: its Mesa and Chromium libraries are preinstalled, the runners share one machine
    # (one ~/apt-archives and one /etc/apt/apt.conf.d), and there is no slow mirror to avoid.
    - name: Runner image
      id: image
      if: runner.environment != 'self-hosted'
      shell: bash
      run: printf "os=%s\nimage=%s-%s\n" "$ImageOS" "$ImageOS" "$ImageVersion" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      if: runner.environment != 'self-hosted'
      with:
        path: ~/apt-archives/*.deb
        key: apt-${{ steps.image.outputs.image }}-${{ hashFiles('crates/x3d-web/package-lock.json') }}
        restore-keys: apt-${{ steps.image.outputs.os }}-

    - name: Chromium and Mesa Vulkan (lavapipe)
      shell: bash
      working-directory: crates/x3d-web
      run: |
        # The runner's CPU: lavapipe renders on it, so the test durations depend on it.
        echo "$(nproc) CPUs: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)" | tee -a "$GITHUB_STEP_SUMMARY"
        # Two runners share one machine on a self-hosted host: apt, dpkg and Playwright's browser directory
        # (~/.cache/ms-playwright) each allow one writer, so those steps take a machine-wide lock (flock) and
        # install only what is missing. On a GitHub-hosted runner the lock is private to the job.
        lock=/tmp/xite-ci-apt.lock
        if [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then
          mkdir -p ~/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/apt-archives" | sudo tee /etc/apt/apt.conf.d/99-ci-archives
        fi
        if ! dpkg -s mesa-vulkan-drivers >/dev/null 2>&1; then
          flock "$lock" sudo apt-get -o DPkg::Lock::Timeout=600 update
          flock "$lock" sudo apt-get -o DPkg::Lock::Timeout=600 install -y --no-install-recommends mesa-vulkan-drivers
        fi
        npm ci --no-audit --no-fund
        flock "$lock" npx playwright install --with-deps chromium
        if [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then sudo chmod -R a+r ~/apt-archives; fi
