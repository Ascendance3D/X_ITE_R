<!DOCTYPE html>
<meta charset="utf-8">
<title>R0.3-B oracle: EXTERNPROTO reload, load state and refresh, frame by frame</title>
<!-- Lives inside the pinned src/ so X_ITE resolves its assets/ the same way it does upstream.
     dump.html and anim.html stay untouched. Like anim.html this page drives the browser's frame loop
     by hand (browser .advanceTime returns false, the harness calls [_traverse]) and runs a virtual clock:

       * browser .getCurrentTime () returns T;
       * Date .now () returns DATE (ms) from the first line on, so the autoRefresh bookkeeping of
         X3DUrlObject (Date .now () at construction and at load completion) is deterministic;
       * window .setTimeout / clearTimeout are a virtual queue that fires in due order.

     Every console message is recorded in order with the harness step it was logged in
     (window .__step), which is the frame-order evidence of the lane. -->
<script>
window.__step = 0;
window.__console = [ ];

for (const m of [ "log", "warn", "error" ])
{
   console [m] = (... a) =>
   {
      window .__console .push ({ step: window .__step, level: m, text: a .map (String) .join (" ") .split ("\n") [0] });
   };
}
</script>
<script src="../node_modules/libtess/libtess.cat.js"></script>
<script src="../node_modules/@create3000/libgif/libgif.js"></script>
<script src="../node_modules/apng-js/lib/index.js"></script>
<x3d-canvas id="c" antialiased="false" splashScreen="false" contextMenu="false" notifications="false"
   timings="false" contentScale="1" style="display:block;width:64px;height:64px"></x3d-canvas>
<script type="module">
// Virtual clock first, before X_ITE reads Date .now ().
let T = 946684800, DATE = T * 1000, allow = true, timers = [ ], timerId = 0;

Date .now = () => DATE;

window .setTimeout = (fn, ms = 0, ... args) =>
{
   const id = ++ timerId;
   timers .push ({ id, due: DATE + Math .max (+ms || 0, 0), seq: id, fn: () => fn (... args) });
   return id;
};

window .clearTimeout = id => { timers = timers .filter (t => t .id !== id); };

await import ("./x_ite.js");

const browser  = document .getElementById ("c") .browser;
const X3D      = window [Symbol .for ("X_ITE.X3D")];
const traverse = browser [Symbol .for ("X_ITE.X3DBrowserContext.traverse")];

browser .getCurrentTime      = () => T;
browser .getCurrentFrameRate = () => 60;
browser .advanceTime         = () => allow;

function runTimers (untilMs)
{
   for (;;)
   {
      timers .sort ((a, b) => a .due - b .due || a .seq - b .seq);

      const t = timers [0];

      if (!t || t .due > untilMs)
         break;

      timers .shift ();

      const saveT = T, saveDATE = DATE;

      DATE = Math .max (DATE, t .due);
      T    = Math .max (T, t .due / 1000);

      try { t .fn (); } catch (e) { console .error (e); }

      T    = saveT;
      DATE = Math .max (saveDATE, DATE);
   }
}

window .load = async function (url, t0, dt)
{
   T = t0;
   DATE = t0 * 1000;
   window .__step = 0;

   try
   {
      await browser .loadURL (new X3D .MFString (url));
      await browser .nextFrame ();
      await browser .nextFrame ();
   }
   catch (e)
   {
      return { ok: false, error: String (e ?.message ?? e) .split ("\n") [0] };
   }

   allow = false;
   return { ok: true };
};

window .setDate = ms => { DATE = ms; };
window .setStep = k => { window .__step = k; };

// One browser frame at browser time `t` (seconds).
window .step = function (t)
{
   runTimers (t * 1000);

   T    = t;
   DATE = Math .max (DATE, t * 1000);

   allow = true;
   traverse .call (browser, 0, undefined);
   allow = false;
};

const externproto = name => browser .currentScene .externprotos .get (name);

// What the harness does to a declaration, the way an embedding application would (SAI: urls, loadNow;
// the load and autoRefresh fields are X_ITE's X3DUrlObject fields on the declaration).
window .act = function (a)
{
   const ep = externproto (a .name);

   switch (a .type)
   {
      case "url":                  ep ._url = new X3D .MFString (... a .url); break;
      case "load":                 ep ._load = a .value; break;
      case "autoRefresh":          ep ._autoRefresh = a .value; break;
      case "autoRefreshTimeLimit": ep ._autoRefreshTimeLimit = a .value; break;
      case "loadNow":              ep .loadNow () .catch (() => { }); break;
      case "remove":               browser .currentScene .removeExternProtoDeclaration (a .name); break;
      default: throw new Error (`unknown action ${a .type}`);
   }
};

const C = X3D .X3DConstants;

const stateName = value => ({
   [C .NOT_STARTED_STATE]: "NOT_STARTED",
   [C .IN_PROGRESS_STATE]: "IN_PROGRESS",
   [C .COMPLETE_STATE]:    "COMPLETE",
   [C .FAILED_STATE]:      "FAILED",
}) [value];

window .snapshot = function ()
{
   const scene = browser .currentScene;

   const externs = Array .from (scene .externprotos, ep => ({
      name: ep .name,
      loadState: stateName (ep .checkLoadState ()),
      url: Array .from (ep ._url),
      proto: ep .getProtoDeclaration () ?.getName () ?? null,
      fields: Array .from (ep .getUserDefinedFields (), f => f .getName ()),
   }));

   const instances = { };

   for (const node of scene .namedNodes)
   {
      const n = node .getValue ();

      if (typeof n ?.getBody !== "function")
         continue;

      const body = n .getBody ();

      instances [n .getName ()] = {
         type: n .getTypeName (),
         body: body ? Array .from (body .rootNodes, r => r ?.getValue () ?.getTypeName () ?? null) : null,
      };
   }

   return { loadCount: scene ._loadCount .getValue (), externs, instances, vrml: scene .toVRMLString () };
};

window .drainConsole = function ()
{
   const out = window .__console;
   window .__console = [ ];
   return out;
};

window .ready = true;
</script>
