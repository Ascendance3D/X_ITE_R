<svg xmlns="http://www.w3.org/2000/svg" width="130" height="10" viewBox="0 0 130 10">
<rect x="0" width="9" height="9" fill="oklch(from oklch(0.5 0.1 20 / 0.5) l c h / 0.5)"/><rect x="10" width="9" height="9" fill="oklch(from oklch(0.6 0.15 40) 1 c h)"/><rect x="20" width="9" height="9" fill="oklch(from oklch(0.6 0.15 40) l c calc(h / 2))"/><rect x="30" width="9" height="9" fill="oklch(from oklch(0.6 0.15 40) l c calc(360 * 2))"/><rect x="40" width="9" height="9" fill="RGB(FROM RED R G B)"/><rect x="50" width="9" height="9" fill="Rgb(From Red r g b)"/><rect x="60" width="9" height="9" fill="rgb(from red r g b)"/><rect x="70" width="9" height="9" fill="rgb(from #12345678 r g b / 25%)"/><rect x="80" width="9" height="9" fill="rgb(from rgb(10.5 20.4 30.7) g b r / 0.5)"/><rect x="90" width="9" height="9" fill="rgb(from #123456 r 0 b)"/><rect x="100" width="9" height="9" fill="rgb(from #123456 r calc(r + g) b)"/><rect x="110" width="9" height="9" fill="rgb(from #123456 r g b / max(r, 100))"/>
</svg>
