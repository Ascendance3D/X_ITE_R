<svg xmlns="http://www.w3.org/2000/svg" width="130" height="10" viewBox="0 0 130 10">
<rect x="0" width="9" height="9" fill="lab(from lab(50 40 20 / 0.5) l a b / calc(0.5))"/><rect x="10" width="9" height="9" fill="lab(from lab(50 40 20 / 0.5) calc(l + 10) a b)"/><rect x="20" width="9" height="9" fill="lab(from lab(50 40 20 / 0.5) l calc(a * 2) b)"/><rect x="30" width="9" height="9" fill="lab(from lab(50 40 20 / 0.5) l a min(l, 20))"/><rect x="40" width="9" height="9" fill="lch(from lch(50 40 120) l c h)"/><rect x="50" width="9" height="9" fill="lch(from lch(40 none 200) l c h / alpha)"/><rect x="60" width="9" height="9" fill="lch(from lab(70 none none / none) l c h)"/><rect x="70" width="9" height="9" fill="lch(from lch(50 40 120) l 10.5 h)"/><rect x="80" width="9" height="9" fill="lch(from lch(50 40 20 / 0.5) l c h / 50%)"/><rect x="90" width="9" height="9" fill="lch(from lch(50 40 120) 150% c h)"/><rect x="100" width="9" height="9" fill="lch(from lch(50 40 120) l c calc(h * alpha))"/><rect x="110" width="9" height="9" fill="lch(from lch(50 40 120 / 0.5) l calc(l * 2) h)"/>
</svg>
