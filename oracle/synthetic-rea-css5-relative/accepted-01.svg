<svg xmlns="http://www.w3.org/2000/svg" width="130" height="10" viewBox="0 0 130 10">
<rect x="0" width="9" height="9" fill="hsl(from color(srgb 0.2 0.4 0.6) h s l / 0.5)"/><rect x="10" width="9" height="9" fill="hsl(from hsl(120 50% 50%) h 1e1 l)"/><rect x="20" width="9" height="9" fill="hsl(from hsl(10 20% 30% / 0.5) h s l / none)"/><rect x="30" width="9" height="9" fill="hsl(from hsl(120 50% 50%) calc(h * 2) s l)"/><rect x="40" width="9" height="9" fill="hsla(from red h s l)"/><rect x="50" width="9" height="9" fill="hsla(from gray h s l)"/><rect x="60" width="9" height="9" fill="hsla(from currentcolor h s l)"/><rect x="70" width="9" height="9" fill="hsla(from #12345678 h s l)"/><rect x="80" width="9" height="9" fill="hsla(from RED h s l)"/><rect x="90" width="9" height="9" fill="hsla(from rgb(10 20 30 / 0.5) h s l)"/><rect x="100" width="9" height="9" fill="hsla(from rgb(100% 50% 25%) h s l)"/><rect x="110" width="9" height="9" fill="hsla(from hsl(120 50% 50%) h s l)"/>
