<!DOCTYPE html>
<meta charset="utf-8">
<!-- The X_ITE_R page of the browser API case: the same canvas as oracle/x_ite-web-api.mjs's X_ITE page. -->
<style>html, body { margin: 0; padding: 0; background: #fff; }</style>
<x3d-canvas style="display:block;width:400px;height:300px"></x3d-canvas>
<script type="module">
import X3D from "../../web/x_ite_r.mjs";

window .X3D_NS = X3D;

X3D .getBrowser () .ready ()
   .then (() => window .ready = true)
   .catch (error => window .startError = String (error));
</script>
