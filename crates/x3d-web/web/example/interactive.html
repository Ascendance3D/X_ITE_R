<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X_ITE_R: input, Inline and texture</title>
<style>
  body { font-family: sans-serif; margin: 1em; }
  x3d-canvas { width: min(640px, 100%); height: 480px; border: 1px solid #888; }
  #status { margin-top: 1em; font-family: monospace; white-space: pre; }
</style>
<!-- No X_ITE JavaScript: x_ite_r.mjs defines <x3d-canvas> over the Rust engine (WebAssembly + WebGPU). Mouse, touch,
     wheel and keyboard go to the Rust engine; it picks, runs the sensors and navigates. -->
<script type="module" src="../x_ite_r.mjs"></script>

<x3d-canvas src="interactive.wrl" contentScale="auto">
  This page needs a browser with WebGPU.
</x3d-canvas>
<p>
  <button id="previous">previousViewpoint</button>
  <button id="next">nextViewpoint</button>
  <button id="all">viewAll</button>
</p>
<div id="status">loading…</div>

<script type="module">
  const canvas  = document .querySelector ("x3d-canvas");
  const browser = canvas .browser;
  const status  = document .getElementById ("status");

  document .getElementById ("previous") .onclick = () => browser .previousViewpoint ();
  document .getElementById ("next")     .onclick = () => browser .nextViewpoint ();
  document .getElementById ("all")      .onclick = () => browser .viewAll ();

  // Field values are read from the Rust engine on each frame of the page. A node handle belongs to one world, so
  // the nodes are looked up again after each load.
  let press, drag;

  canvas .addEventListener ("load", () =>
  {
    const scene = browser .currentScene;

    [ press, drag ] = scene .worldURL .endsWith ("interactive.wrl") ? [ scene .getNamedNode ("Press"), scene .getNamedNode ("Drag") ] : [ ];
  });

  const show = () =>
  {
    try
    {
      if (press)
      {
        status .textContent = `Press.isActive = ${press .isActive}\nDrag.translation_changed = ${drag .translation_changed}\n` +
          `activeViewpoint = ${browser .activeViewpoint ?.getNodeName () ?? "(default)"}`;
      }
    }
    catch
    {
      // The world was replaced; the "load" of the new one looks the nodes up again.
      press = undefined;
    }

    requestAnimationFrame (show);
  };

  show ();

  canvas .addEventListener ("error", () => status .textContent = "the world did not load");
  browser .ready () .catch (error => status .textContent = `X_ITE_R could not start: ${error}`);
</script>
