[package]
name = "x3d-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Offscreen wgpu renderer for X3D/VRML scenes, ported from X_ITE's renderer and WebGL2 shaders (MIT)."

[dependencies]
x3d-fields = { path = "../x3d-fields" }
x3d-scene = { path = "../x3d-scene" }
x3d-parse = { path = "../x3d-parse" }
x3d-runtime = { path = "../x3d-runtime" }
x3d-script = { path = "../x3d-script", optional = true }
x3d-text = { path = "../x3d-text" }
url = "2"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
serde_json = "1"
sha2 = "0.10"
# The tangent generator X_ITE ships as assets/lib/mikktspace_bg.wasm (built from mikktspace 0.3.0).
mikktspace = "=0.3.0"
# Batch 08 shaders lane: GLSL (rewritten to #version 450) -> naga -> WGSL for ComposedShader.
# Instant on wasm32-unknown-unknown too (std::time::Instant panics there).
web-time = "1"
naga = { version = "=30.0.1", default-features = false, features = ["glsl-in", "wgsl-in", "wgsl-out"] }

[features]
default = ["script"]
# Script nodes in QuickJS, and the oracle loader that runs them (`load`, `render_file`). QuickJS is C
# code that does not build for wasm32-unknown-unknown, so the browser build (x3d-web) turns it off.
script = ["dep:x3d-script"]

[[bin]]
name = "x3d-shot"
required-features = ["script"]

[[example]]
name = "node_census"
required-features = ["script"]

[dev-dependencies]
x3d-evidence = { path = "../x3d-evidence" }
