[package]
name = "x3d-vrml1"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VRML 1.0 ascii loader that converts into the engine scene, a Rust port of the x_ite-vrml1-parser extension (MIT). Not part of the X_ITE 16.5.0 pin."

[dependencies]
x3d-fields = { path = "../x3d-fields" }
x3d-scene = { path = "../x3d-scene" }

[dev-dependencies]
x3d-parse = { path = "../x3d-parse" }
