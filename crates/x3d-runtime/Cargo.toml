[package]
name = "x3d-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "X3D scene runtime: event engine, PROTO instancing, loading; ported from X_ITE (MIT)."

[features]
default = ["native-video"]
# The engine's own video decoders for a MovieTexture (webm.rs, vp8/, vp9dec, mpeg1/). The browser build (x3d-web) turns it off:
# there the page plays the video in a <video> element (`Fetcher::plays_video`) and these decoders are never called.
native-video = ["dep:vp9dec"]
# AV1 video in MovieTexture (rav1d, BSD-2-Clause). OFF by default until the owner decides how to contain rav1d's
# abort on some damaged streams (BR1.8, see the PR that added it). CI runs the tests with `--features x3d-runtime/av1`.
av1 = ["native-video", "dep:rav1d"]
# rav1d's hand-written assembly (needs nasm; not for wasm32).
av1-asm = ["av1", "rav1d/asm"]

[dependencies]
x3d-fields = { path = "../x3d-fields" }
x3d-scene = { path = "../x3d-scene" }
x3d-parse = { path = "../x3d-parse" }
x3d-text = { path = "../x3d-text" }
# VP9 decode of a MovieTexture WebM (webm.rs): MIT, no dependencies, conformance-tested against the libvpx vectors.
# Optional: only the `native-video` feature builds it (the browser build has a <video> element and leaves it out).
vp9dec = { version = "0.1.1", optional = true }
# AV1 decode of a MovieTexture WebM (av1.rs, feature `av1`): BSD-2-Clause, a Rust port of dav1d (owner decision
# 2026-11-02). Its `asm` default feature is off: it needs nasm at build time and does not exist on wasm32. Patent exposure is an unresolved release risk recorded in
# docs/decoder-admission.md; this dependency is not a patent clearance.
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"], optional = true }
url = "2"
percent-encoding = "2"
# Image headers only (X3DTexture2DNode width and height); the same crate x3d-render decodes with.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# The Sound component (sound.rs): a Rust implementation of the W3C Web Audio API, the API X_ITE's
# Sound nodes are written against. Its default backend is cpal (ALSA on Linux, CoreAudio on macOS).
web-audio-api = "1.7.0"
# The file's own sample rate and frames for MP3, FLAC and Ogg Vorbis (sound/decode.rs), which web-audio-api resamples
# itself. The same crate and version web-audio-api already builds with "all"; no feature beyond that set.
symphonia = { version = "0.6.1", default-features = false, features = ["mp2", "mp3", "flac", "ogg", "vorbis", "wav", "pcm", "mkv", "all-meta"] }
# FFTFrame (sound/fft_frame.rs): the FFT of Chromium's FFTFrame, also in web-audio-api's tree.
rustfft = "6.4.1"
# Instant and SystemTime that also work on wasm32-unknown-unknown (std panics there); std's own types on
# other targets.
web-time = "1"

[dev-dependencies]
# Reads the gzip-compressed ffmpeg reference planes of the MPEG-1 tests (already in the tree through x3d-parse).
flate2 = "1"
# VP9 decode of a MovieTexture WebM (webm.rs): MIT, no dependencies, conformance-tested against the libvpx vectors.
vp9dec = "0.1.1"
url = "2"
serde_json = "1"
sha2 = "0.10"
x3d-evidence = { path = "../x3d-evidence" }
