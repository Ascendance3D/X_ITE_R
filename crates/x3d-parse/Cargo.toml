[package]
name = "x3d-parse"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VRML97 / X3D classic encoding parser, ported from X_ITE (MIT)."

[dependencies]
x3d-fields = { path = "../x3d-fields" }
x3d-scene = { path = "../x3d-scene" }
flate2 = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
