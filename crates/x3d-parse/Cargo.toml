[package]
name = "x3d-parse"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VRML97 / X3D classic encoding parser, ported from X_ITE (MIT)."

[features]
# `#VRML V1.0 ascii` loader (a port of the x_ite-vrml1-parser extension, not part of the pin).
# Off by default; even when compiled in, a call must also pass `ParseOptions { vrml1: true }`.
vrml1 = ["dep:x3d-vrml1"]

[dependencies]
x3d-vrml1 = { path = "../x3d-vrml1", optional = true }
x3d-fields = { path = "../x3d-fields" }
x3d-scene = { path = "../x3d-scene" }
x3d-text = { path = "../x3d-text" }
flate2 = "1"
meshopt-pure = { version = "1.3.0", default-features = false }
draco-core = { version = "2.3.3", default-features = false, features = ["decoder", "point_cloud_decode", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
quick-xml = "0.41"
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
# Enables the `vrml1` feature for this package's own tests only.
x3d-parse = { path = ".", features = ["vrml1"] }
draco-core = { version = "2.3.3", features = ["encoder"] }
x3d-evidence = { path = "../x3d-evidence" }
