[package]
name = "x3d-script"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "X3D Script node engine on QuickJS (rquickjs), ported from X_ITE's Scripting component (MIT)."

[dependencies]
x3d-fields = { path = "../x3d-fields" }
x3d-scene = { path = "../x3d-scene" }
x3d-parse = { path = "../x3d-parse" }
x3d-runtime = { path = "../x3d-runtime" }
rquickjs = { version = "0.11", features = [] }
serde_json = "1"

[dev-dependencies]
x3d-evidence = { path = "../x3d-evidence" }
url = "2"
