[package]
name = "vrml97"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "VRML97 / X3D classic-encoding parser and writer, a faithful Rust port of X_ITE's parser, field types and serializer"
readme = "README.md"
keywords = ["vrml", "vrml97", "x3d", "3d", "parser"]
categories = ["parser-implementations", "graphics", "rendering::data-formats"]
include = ["src/**/*.rs", "README.md", "LICENSE", "Cargo.toml"]

# Private Option B facade (R0.2-D). Path-only dependencies: this manifest cannot be
# packaged until the engine crates are published (R0.2-B section 9.2).
[dependencies]
x3d-fields = { path = "../x3d-fields" }
x3d-scene = { path = "../x3d-scene" }
x3d-parse = { path = "../x3d-parse" }

[dev-dependencies]
x3d-evidence = { path = "../x3d-evidence" }
serde_json = "1"
