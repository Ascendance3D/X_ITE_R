# Reference pins for the X_ITE -> Rust port.
# Read by tools/verify-candidate.sh. Fail-closed: the reference checks must match every
# X_ITE_* value here. CI runs the reference checks on every pull request.
#
# --- Historical evidence: the R0.1 research candidate --------------------------
# R0.1 approved one research snapshot, a553381 (2026-10-14, "math: port Matrix4.factor and
# get_transform"), then in the private rust-port repository. That repository is now
# X_ITE_R (X_ITE/scratch/rust-port is a symlink to it); the branch and worktree below no
# longer exist. The approval does not apply to any later commit. The gate does not read
# these values: an identity check needs an explicit --expect <sha>, and no commit (master
# included) is an approved release candidate unless the owner names it.
HISTORICAL_R01_CANDIDATE_COMMIT=a553381b9f4d950d71032096fb2a27d30cd68b93
HISTORICAL_R01_CANDIDATE_BRANCH=research/r0-1-baseline-authority
HISTORICAL_R01_CANDIDATE_WORKTREE=/home/ryan/Projects/cybertown/.worktrees/r0-1-baseline-authority

# --- Reference source: X_ITE ------------------------------------------------
# The X_ITE source this port is translated from. Do not change without owner review.
# The gate checks the commit, the version, and a digest of the vendored source.
X_ITE_PIN=34cdf9f97145b3cd2b8e250f8c88dfdd083c0517
X_ITE_VERSION=16.5.0
X_ITE_REF_DIR=oracle/x_ite-pin/src
X_ITE_PIN_FILE=oracle/x_ite-pin/PINNED_COMMIT
X_ITE_VERSION_FILE=oracle/x_ite-pin/package.json
# Re-blessed 2026-10-24 after proving the reference source is unchanged.
# X_ITE_REF_DIR holds upstream's 846 src/ files AND 11 QA harness HTML pages that are ours,
# so this digest moves whenever a harness page is edited. Nine of them changed after the
# lock was first written (extern/inline/nodes.html added, anim/anim-msaa/anim-sized/dump/
# shot/shot-msaa.html modified: 533 insertions, 0 deletions), taking 854 -> 857.
# `diff -r` against `git archive 34cdf9f97 src/` reports zero content differences across all
# 846 upstream files, so no reference byte drifted. The scope is the real defect: covering
# our own mutable pages guarantees this drifts again. Narrowing it to upstream's 846 needs
# owner approval and is not done here.
X_ITE_REF_DIGEST=83fb7cae30ef3a9a5040acbe463024f72683ecde29d70c0d68a06165eab8506f
X_ITE_REF_FILES=857

# Infrastructure that may change on top of an expected commit (--expect <sha>).
# A commit whose entire diff against the expected commit touches only these paths
# still counts as that commit. Any other difference refuses.
# This keeps the gate fail-closed for the renderer and runtime, which is the
# thing the gate exists to protect.
ALLOWED_INFRA_FILES="tools/verify-candidate.sh tools/candidate.lock tools/reference-digest.py tools/selftest-identity.sh"