[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# Each integration test links the whole engine; full debug info made every
# test binary about 450 MB and a build directory 50 to 80 GB. Line tables keep
# backtraces readable. The test profile inherits from dev.
[profile.dev]
debug = "line-tables-only"

# web-audio-api 1.7.0 with two feature lists narrowed so that no AAC decoder (symphonia-codec-aac, 0.5.5 and 0.6.1) is in
# the dependency graph of any build. Upstream offers no feature to do this (its aac/m4a/mp3 features are empty). Source,
# modification and how to check it: vendor/web-audio-api/VENDOR.md (owner direction 2026-11-02, issue #90).
[patch.crates-io]
web-audio-api = { path = "vendor/web-audio-api" }
# rav1d 1.1.0 with the one-line fix of vendor/rav1d/VENDOR.md (a damaged AV1 tile aborts the process in upstream).
rav1d = { path = "vendor/rav1d" }

# vp9dec at opt-level 3 overflows the stack of rustc 1.95 (SIGSEGV in LLVM); 2 builds.
[profile.release.package.vp9dec]
opt-level = 2
